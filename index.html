<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filters</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      flex-direction: column;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
    }
    #status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      color: lime;
      background: rgba(0,0,0,0.7);
      font-family: monospace;
      font-size: 12px;
      padding: 4px;
      z-index: 10;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="status">Başlıyor...</div>
  <canvas id="canvas"></canvas>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver,
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const statusEl = document.getElementById("status");
    function log(msg) {
      statusEl.textContent = msg;
      console.log(msg);
    }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const video = document.createElement("video");
    video.playsInline = true;
    video.muted = true;

    let handLandmarker = null;

    async function setupHandLandmarker() {
      log("Model dosyaları indiriliyor...");
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      log("Model yükleniyor...");
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        numHands: 2,
      });
      log("Model hazır, kamera başlatılıyor...");
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: 640, height: 480 },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      log("Çalışıyor.");
      drawLoop();
    }

    const INDEX_TIP = 8;
    const THUMB_TIP = 4;

    // ---- Portal geometrisi ----

    function portalWidth(p1, p2, p3, p4) {
      const topW = Math.hypot(p3.x - p1.x, p3.y - p1.y);
      const bottomW = Math.hypot(p4.x - p2.x, p4.y - p2.y);
      return (topW + bottomW) / 2.0;
    }

    class ClosingGestureDetector {
      constructor(closeRatio = 0.16, openRatio = 0.30) {
        this.closeRatio = closeRatio;
        this.openRatio = openRatio;
        this.isClosed = false;
      }
      update(width, frameW) {
        const closeThreshold = this.closeRatio * frameW;
        const openThreshold = this.openRatio * frameW;
        let triggered = false;
        if (!this.isClosed && width < closeThreshold) {
          this.isClosed = true;
          triggered = true;
        } else if (this.isClosed && width > openThreshold) {
          this.isClosed = false;
        }
        return triggered;
      }
    }

    // ---- Yardımcılar ----

    function clamp(v, lo, hi) {
      return v < lo ? lo : v > hi ? hi : v;
    }

    function grayAt(data, i) {
      // Basit luma
      return 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    }

    function jetColor(t) {
      t = clamp(t, 0, 1);
      let r, g, b;
      if (t < 0.125) {
        r = 0; g = 0; b = 0.5 + 4 * t;
      } else if (t < 0.375) {
        r = 0; g = 4 * (t - 0.125); b = 1;
      } else if (t < 0.625) {
        r = 4 * (t - 0.375); g = 1; b = 1 - 4 * (t - 0.375);
      } else if (t < 0.875) {
        r = 1; g = 1 - 4 * (t - 0.625); b = 0;
      } else {
        r = 1 - 4 * (t - 0.875); g = 0; b = 0;
      }
      return [r * 255, g * 255, b * 255];
    }

    // Canvas'ın yerleşik blur filtresini kullanan yardımcı (performans için)
    let blurCanvasA = document.createElement("canvas");
    let blurCanvasB = document.createElement("canvas");
    function gaussianBlur(imageData, radiusPx) {
      const { width, height } = imageData;
      blurCanvasA.width = width;
      blurCanvasA.height = height;
      blurCanvasB.width = width;
      blurCanvasB.height = height;
      const ctxA = blurCanvasA.getContext("2d");
      const ctxB = blurCanvasB.getContext("2d");
      ctxA.putImageData(imageData, 0, 0);
      ctxB.clearRect(0, 0, width, height);
      ctxB.filter = `blur(${radiusPx}px)`;
      ctxB.drawImage(blurCanvasA, 0, 0);
      ctxB.filter = "none";
      return ctxB.getImageData(0, 0, width, height);
    }

    // ---- Filtreler (filters.py'nin JS karşılığı) ----

    function filtroGrid(imageData) {
      const { data, width, height } = imageData;
      const step = 22;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (x % step === 0 || y % step === 0) {
            const i = (y * width + x) * 4;
            // orijinal * 0.25 + gri(235) * 0.75
            data[i] = data[i] * 0.25 + 235 * 0.75;
            data[i + 1] = data[i + 1] * 0.25 + 235 * 0.75;
            data[i + 2] = data[i + 2] * 0.25 + 235 * 0.75;
          }
        }
      }
      return imageData;
    }

    function filtro1(imageData) {
      const { data, width, height } = imageData;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const g = grayAt(data, i);
          let r, gg, b;
          if (g < 60) { r = 10; gg = 8; b = 15; }
          else if (g < 130) { r = 214; gg = 30; b = 118; }
          else if (g < 195) { r = 235; gg = 140; b = 35; }
          else { r = 240; gg = 240; b = 235; }
          data[i] = r; data[i + 1] = gg; data[i + 2] = b;
        }
      }
      return imageData;
    }

    function filtro2(imageData) {
      const { data, width, height } = imageData;
      const cell = 6;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const g = grayAt(data, i);
          const cx = (x % cell) - cell / 2;
          const cy = (y % cell) - cell / 2;
          const distCenter = Math.sqrt(cx * cx + cy * cy);
          const radius = (1 - g / 255) * (cell / 1.4);
          if (distCenter < radius) {
            data[i] = 15; data[i + 1] = 15; data[i + 2] = 15;
          } else {
            data[i] = 245; data[i + 1] = 245; data[i + 2] = 245;
          }
        }
      }
      return imageData;
    }

    function filtro3(imageData) {
      const { data, width, height } = imageData;
      const shift = 6;
      const src = new Uint8ClampedArray(data); // orijinal kopya
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const rx = (x + shift) % width;
          const bx = ((x - shift) % width + width) % width;
          const ri = (y * width + rx) * 4;
          const bi = (y * width + bx) * 4;
          let r = src[ri];       // kırmızı kanal kaydırılmış
          let g = src[i + 1];
          let b = src[bi + 2];   // mavi kanal ters kaydırılmış

          if (y % 3 === 0) {
            r *= 0.72; g *= 0.72; b *= 0.72;
          }
          data[i] = r; data[i + 1] = g; data[i + 2] = b;
        }
      }
      return imageData;
    }

    function filtro5(imageData) {
      const { data, width, height } = imageData;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const g = grayAt(data, i) / 255;
          const [r, gg, b] = jetColor(g);
          data[i] = r; data[i + 1] = gg; data[i + 2] = b;
        }
      }
      return imageData;
    }

    function filtro6(imageData) {
      const { data, width, height } = imageData;
      const cx = width / 2, cy = height / 2;
      const maxDist = Math.sqrt(cx * cx + cy * cy) || 1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const rr = data[i], gg = data[i + 1], bb = data[i + 2];
          // Sepia matrisi
          let r = 0.393 * rr + 0.769 * gg + 0.189 * bb;
          let g = 0.349 * rr + 0.686 * gg + 0.168 * bb;
          let b = 0.272 * rr + 0.534 * gg + 0.131 * bb;

          const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
          const vignette = clamp(1 - 0.5 * (dist / maxDist), 0, 1);

          r *= vignette; g *= vignette; b *= vignette;

          const noise = Math.random() * 25;
          data[i] = clamp(r + noise, 0, 255);
          data[i + 1] = clamp(g + noise, 0, 255);
          data[i + 2] = clamp(b + noise, 0, 255);
        }
      }
      return imageData;
    }

    function filtroBlanco(imageData) {
      const blurred = gaussianBlur(imageData, 12);
      const data = blurred.data;
      for (let j = 0; j < data.length; j += 4) {
        data[j] = data[j] * 0.55 + 255 * 0.45;
        data[j + 1] = data[j + 1] * 0.55 + 255 * 0.45;
        data[j + 2] = data[j + 2] * 0.55 + 255 * 0.45;
      }
      return blurred;
    }

    function filtroRosa(imageData) {
      const { data, width, height } = imageData;
      const cell = 5;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const g = grayAt(data, i);
          const cx = (x % cell) - cell / 2;
          const cy = (y % cell) - cell / 2;
          const distCenter = Math.sqrt(cx * cx + cy * cy);
          const radius = (1 - g / 255) * (cell / 1.3);
          if (distCenter < radius) {
            data[i] = 130; data[i + 1] = 20; data[i + 2] = 55;
          } else {
            data[i] = 245; data[i + 1] = 190; data[i + 2] = 215;
          }
        }
      }
      return imageData;
    }

    const FILTROS = [
      filtroGrid,
      filtro1,
      filtro2,
      filtro3,
      filtro5,
      filtro6,
      filtroBlanco,
      filtroRosa,
    ];
    let filtroIndex = 0;

    // ---- Portal render ----

    function renderPortal(p1, p2, p3, p4, filtroFunc) {
      const polygon = [p1, p3, p4, p2];

      const xs = polygon.map((p) => p.x);
      const ys = polygon.map((p) => p.y);
      let x = Math.max(0, Math.floor(Math.min(...xs)));
      let y = Math.max(0, Math.floor(Math.min(...ys)));
      let bw = Math.ceil(Math.max(...xs)) - x;
      let bh = Math.ceil(Math.max(...ys)) - y;
      bw = Math.min(bw, canvas.width - x);
      bh = Math.min(bh, canvas.height - y);
      if (bw <= 1 || bh <= 1) return;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(polygon[0].x, polygon[0].y);
      for (let i = 1; i < polygon.length; i++) {
        ctx.lineTo(polygon[i].x, polygon[i].y);
      }
      ctx.closePath();
      ctx.clip();

      const imageData = ctx.getImageData(x, y, bw, bh);
      const filtered = filtroFunc(imageData);
      ctx.putImageData(filtered, x, y);

      ctx.restore();

      ctx.beginPath();
      ctx.moveTo(polygon[0].x, polygon[0].y);
      for (let i = 1; i < polygon.length; i++) {
        ctx.lineTo(polygon[i].x, polygon[i].y);
      }
      ctx.closePath();
      ctx.strokeStyle = "white";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    const closingDetector = new ClosingGestureDetector();

    function drawLoop() {
      const nowMs = performance.now();
      let results = null;

      if (handLandmarker) {
        results = handLandmarker.detectForVideo(video, nowMs);
      }

      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      ctx.restore();

      if (results && results.landmarks && results.landmarks.length === 2) {
        const hands = results.landmarks
          .map((lm) => ({ lm, mirroredX: 1 - lm[INDEX_TIP].x }))
          .sort((a, b) => a.mirroredX - b.mirroredX);

        const lmLeft = hands[0].lm;
        const lmRight = hands[1].lm;

        const toPoint = (landmark) => ({
          x: (1 - landmark.x) * canvas.width,
          y: landmark.y * canvas.height,
        });

        const p1 = toPoint(lmLeft[INDEX_TIP]);
        const p2 = toPoint(lmLeft[THUMB_TIP]);
        const p3 = toPoint(lmRight[INDEX_TIP]);
        const p4 = toPoint(lmRight[THUMB_TIP]);

        const width = portalWidth(p1, p2, p3, p4);

        if (closingDetector.update(width, canvas.width)) {
          filtroIndex = (filtroIndex + 1) % FILTROS.length;
        }

        renderPortal(p1, p2, p3, p4, FILTROS[filtroIndex]);
      }

      requestAnimationFrame(drawLoop);
    }

    async function main() {
      try {
        await setupHandLandmarker();
        await startCamera();
      } catch (err) {
        log("HATA: " + err.message);
      }
    }

    main();
  </script>
</body>
</html>
