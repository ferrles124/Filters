<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sky Hunt</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;display:grid;place-items:center;background:#071326;font-family:system-ui,sans-serif}canvas{width:min(100vw,1280px);height:min(100vh,720px);object-fit:contain}#status{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:3;padding:9px 16px;border-radius:999px;background:#07101dcc;color:#fff;font-size:14px;text-align:center}#start{position:fixed;z-index:4;border:0;border-radius:14px;padding:14px 24px;background:#ffb703;color:#18202b;font-size:18px;font-weight:700;cursor:pointer}#start.hidden{display:none}</style>
</head>
<body><div id="status">Oyunu başlatmak için butona bas</div><button id="start">Oyunu Başlat</button><canvas id="game" width="1280" height="720"></canvas><video id="camera" autoplay playsinline muted hidden></video>
<script type="module">
import{HandLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const c=document.getElementById("game"),x=c.getContext("2d"),v=document.getElementById("camera"),status=document.getElementById("status"),start=document.getElementById("start");
const W=1280,H=720,TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let model,stream,lastVideo=-1,lastTime=performance.now(),hand=null,ducks=[],clouds=[],score=0,lives=7,spawn=0,world=0,over=false,lastShot=-Infinity,recoil=0,flash=0;
let aim={x:W*.5,y:H*.48},aimTarget={...aim},gesture={gun:false,trigger:false,wasPressed:false,stable:0};
function cloud(init=false){return{x:init?rnd(-100,W):W+rnd(60,240),y:rnd(55,300),s:rnd(.7,1.7),speed:rnd(7,21)}}clouds=Array.from({length:9},()=>cloud(true));
function duck(){let dir=Math.random()<.5?1:-1;return{x:dir>0?-100:W+100,y:rnd(135,H*.7),dir,speed:rnd(85,155),size:rnd(46,66),phase:rnd(0,TAU),age:0}}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function ext(lm,tip,mcp){return d(lm[tip],lm[0])>d(lm[mcp],lm[0])*1.14}
function sky(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#318ec9");g.addColorStop(.72,"#bcecff");g.addColorStop(1,"#d9f2c0");x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle="#78b86e";x.fillRect(0,H*.78,W,H*.22);x.fillStyle="#a4d582";for(let q=-80-world*.3%80;q<W+80;q+=80){x.beginPath();x.moveTo(q,H*.78);x.lineTo(q+38,H*.7);x.lineTo(q+76,H*.78);x.fill()}for(const z of clouds){x.save();x.translate(z.x,z.y);x.scale(z.s,z.s);x.fillStyle="#fff";for(const [a,b,r]of[[0,8,35],[38,0,48],[78,12,32],[42,20,55]]){x.beginPath();x.arc(a,b,r,0,TAU);x.fill()}x.restore()}}
function drawDuck(a){x.save();x.translate(a.x,a.y+Math.sin(a.age*4+a.phase)*14);x.scale(a.dir,1);let s=a.size;x.fillStyle="#f6c544";x.beginPath();x.ellipse(0,0,s,s*.48,0,0,TAU);x.fill();x.fillStyle="#ffe477";x.beginPath();x.arc(s*.56,-s*.27,s*.38,0,TAU);x.fill();x.fillStyle="#e87827";x.beginPath();x.moveTo(s*.82,-s*.28);x.lineTo(s*1.28,-s*.15);x.lineTo(s*.82,-s*.03);x.fill();x.fillStyle="#fff";x.beginPath();x.ellipse(-s*.1,-s*.1,s*.33,s*.15,-.45,0,TAU);x.fill();x.fillStyle="#202938";x.beginPath();x.arc(s*.64,-s*.36,Math.max(3,s*.07),0,TAU);x.fill();x.restore()}
function pt(a,b,n){let l=Math.hypot(b.x-a.x,b.y-a.y)||1;return{x:a.x+(b.x-a.x)/l*n,y:a.y+(b.y-a.y)/l*n}}
// FPS görünümü: silah sabit birinci şahıs pozisyonunda, hedef hareketi yalnızca hafif nişan eğimiyle silaha yansır.
function drawWeapon(){if(!gesture.gun)return;let swayX=clamp((aim.x-W/2)*.055,-28,28),swayY=clamp((aim.y-H*.48)*.035,-14,18),kick=recoil*18;let gx=W*.58+swayX,gy=H-112+swayY+kick,ang=clamp((aim.x-W/2)*.00055,-.24,.24)-recoil*.035;x.save();x.translate(gx,gy);x.rotate(ang);x.lineCap="round";
// tek kol ve el, kamera görüntüsü değil stilize FPS modeli
x.strokeStyle="#7b493d";x.lineWidth=108;x.beginPath();x.moveTo(-42,235);x.lineTo(-4,78);x.stroke();x.strokeStyle="#d89472";x.lineWidth=86;x.beginPath();x.moveTo(-42,235);x.lineTo(-4,78);x.stroke();
// eldivenli el ve başparmak
x.fillStyle="#d89472";x.beginPath();x.ellipse(0,52,63,46,-.12,0,TAU);x.fill();x.fillStyle="#bd7559";x.beginPath();x.ellipse(42,39,28,15,-.65,0,TAU);x.fill();
// tabanca gövdesi, kızak, gez ve kabza
x.shadowColor="#0009";x.shadowBlur=18;x.fillStyle="#1b2432";x.beginPath();x.roundRect(-22,-15,188,58,14);x.fill();x.fillStyle="#303e51";x.beginPath();x.roundRect(40,-32,135,31,8);x.fill();x.fillStyle="#111925";x.beginPath();x.roundRect(164,-24,70,18,5);x.fill();x.fillStyle="#52647b";x.fillRect(63,-23,74,5);x.shadowBlur=0;x.fillStyle="#151c28";x.beginPath();x.moveTo(-4,29);x.lineTo(51,30);x.lineTo(42,151);x.lineTo(-18,126);x.closePath();x.fill();x.fillStyle="#34445a";x.beginPath();x.roundRect(7,51,30,72,8);x.fill();x.strokeStyle="#708097";x.lineWidth=3;x.strokeRect(30,-31,34,8);
if(flash>0){x.shadowColor="#ffd34d";x.shadowBlur=30;x.fillStyle=`rgba(255,225,90,${flash})`;x.beginPath();x.moveTo(235,-15);x.lineTo(304,-45);x.lineTo(278,-8);x.lineTo(311,15);x.lineTo(238,8);x.closePath();x.fill()}x.restore()}
function reticle(){if(!hand)return;x.strokeStyle=gesture.gun?"#ffe066":"#fff";x.lineWidth=3;x.beginPath();x.arc(aim.x,aim.y,24,0,TAU);x.stroke();x.beginPath();x.moveTo(aim.x-36,aim.y);x.lineTo(aim.x-10,aim.y);x.moveTo(aim.x+10,aim.y);x.lineTo(aim.x+36,aim.y);x.moveTo(aim.x,aim.y-36);x.lineTo(aim.x,aim.y-10);x.moveTo(aim.x,aim.y+10);x.lineTo(aim.x,aim.y+36);x.stroke()}
function shoot(now){if(!gesture.trigger||now-lastShot<380)return;lastShot=now;recoil=1;flash=1;let hit=null,best=Infinity;for(const q of ducks){let n=d(q,aim);if(n<best){best=n;hit=q}}if(hit&&best<Math.max(125,hit.size*2.25)){ducks.splice(ducks.indexOf(hit),1);score++}else score=Math.max(0,score-1)}
function read(result){if(!result.landmarks?.length){hand=null;gesture={gun:false,trigger:false,wasPressed:false,stable:0};return}let lm=result.landmarks[0];let thumbOpen=d(lm[4],lm[0])>d(lm[2],lm[0])*.94,indexOpen=ext(lm,8,5),middleClosed=!ext(lm,12,9),ringClosed=!ext(lm,16,13),pinkyClosed=!ext(lm,20,17);let gun=thumbOpen&&indexOpen&&middleClosed&&ringClosed&&pinkyClosed;let thumb={x:(1-lm[4].x)*W,y:lm[4].y*H};let triggerDistance=d(lm[8],lm[5]);let curled=triggerDistance<d(lm[12],lm[9])*.92;gesture.gun=gun;gesture.trigger=false;if(!gun){gesture.wasPressed=false;gesture.stable=0}else{gesture.stable++;if(gesture.stable>2&&curled&&!gesture.wasPressed){gesture.trigger=true;gesture.wasPressed=true}else if(!curled)gesture.wasPressed=false}hand={thumb,gun};aimTarget={x:thumb.x,y:thumb.y}}
async function setup(){status.textContent="El modeli yükleniyor...";let vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");model=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numHands:1,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:false});v.srcObject=stream;await v.play();start.classList.add("hidden");status.textContent="Başparmak + işaret açık; diğerleri kapalı. İşaret parmağını büküp açarak ateş et.";requestAnimationFrame(loop)}
function loop(now){let dt=Math.min(.05,(now-lastTime)/1000);lastTime=now;world+=dt*70;recoil=Math.max(0,recoil-dt*7);flash=Math.max(0,flash-dt*10);sky();for(const q of clouds){q.x-=q.speed*dt;if(q.x<-190)Object.assign(q,cloud())}if(!over){spawn-=dt;if(spawn<=0){ducks.push(duck());spawn=rnd(1,1.8)}for(const q of ducks){q.x+=q.dir*q.speed*dt;q.age+=dt;drawDuck(q)}for(let i=ducks.length-1;i>=0;i--)if(ducks[i].x<-160||ducks[i].x>W+160){ducks.splice(i,1);lives--}if(v.readyState>=2&&v.currentTime!==lastVideo){lastVideo=v.currentTime;read(model.detectForVideo(v,now))}aim.x+=(aimTarget.x-aim.x)*Math.min(1,dt*12);aim.y+=(aimTarget.y-aim.y)*Math.min(1,dt*12);shoot(now);drawWeapon();reticle();if(lives<=0)over=true}x.fillStyle="#102238cc";x.fillRect(18,18,390,82);x.fillStyle="#fff";x.font="bold 24px system-ui";x.fillText(`Skor: ${score}`,34,50);x.fillText(`Can: ${"♥".repeat(Math.max(0,lives))}`,34,79);if(over){x.fillStyle="#102238dd";x.fillRect(0,0,W,H);x.fillStyle="#fff";x.textAlign="center";x.font="bold 64px system-ui";x.fillText("Oyun Bitti",W/2,H/2-20);x.font="28px system-ui";x.fillText(`Skorun: ${score} — Yenilemek için sayfayı yenile`,W/2,H/2+40);x.textAlign="start"}requestAnimationFrame(loop)}
start.addEventListener("click",()=>setup().catch(e=>status.textContent="Hata: "+e.message));window.addEventListener("beforeunload",()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
