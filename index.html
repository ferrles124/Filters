<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Hunt</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;display:grid;place-items:center;background:#071326;font-family:system-ui,sans-serif}canvas{width:min(100vw,1280px);height:min(100vh,720px);object-fit:contain}#status{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:4;padding:9px 16px;border-radius:999px;background:#07101dcc;color:#fff;font-size:14px;text-align:center}#start{position:fixed;z-index:5;border:0;border-radius:14px;padding:14px 24px;background:#ffb703;color:#18202b;font-size:18px;font-weight:700;cursor:pointer}#start.hidden{display:none}</style>
</head>
<body><div id="status">Oyunu başlatmak için butona bas</div><button id="start">Oyunu Başlat</button><canvas id="game" width="1280" height="720"></canvas><video id="camera" autoplay playsinline muted hidden></video>
<script type="module">
import{HandLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const c=document.getElementById('game'),ctx=c.getContext('2d'),video=document.getElementById('camera'),status=document.getElementById('status'),start=document.getElementById('start');
const W=1280,H=720,TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const assets={duck:new Image(),weapon:new Image(),hand:new Image(),flash:new Image()};assets.duck.src='assets/duck.svg';assets.weapon.src='assets/weapon.svg';assets.hand.src='assets/hand-arm.svg';assets.flash.src='assets/muzzle-flash.svg';
let model,stream,lastVideo=-1,lastFrame=performance.now(),aim={x:W/2,y:H*.44},targetAim={...aim},hand=null,ducks=[],clouds=[],score=0,lives=7,spawn=0,world=0,over=false,lastShot=-Infinity,recoil=0,flash=0;
let fingerState={closed:false,openFrames:0,closedFrames:0};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const cloud=(initial=false)=>({x:initial?rnd(-120,W):W+rnd(50,230),y:rnd(55,300),s:rnd(.7,1.6),speed:rnd(7,20)});clouds=Array.from({length:9},()=>cloud(true));
function duck(){let dir=Math.random()<.5?1:-1;return{x:dir>0?-110:W+110,y:rnd(130,H*.69),dir,speed:rnd(80,145),size:rnd(62,82),phase:rnd(0,TAU),age:0}}
function sky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#318ec9');g.addColorStop(.72,'#bcecff');g.addColorStop(1,'#d9f2c0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#78b86e';ctx.fillRect(0,H*.78,W,H*.22);ctx.fillStyle='#a4d582';for(let q=-80-world*.3%80;q<W+80;q+=80){ctx.beginPath();ctx.moveTo(q,H*.78);ctx.lineTo(q+38,H*.7);ctx.lineTo(q+76,H*.78);ctx.fill()}for(const z of clouds){ctx.save();ctx.translate(z.x,z.y);ctx.scale(z.s,z.s);ctx.fillStyle='#fff';for(const [a,b,r]of[[0,8,35],[38,0,48],[78,12,32],[42,20,55]]){ctx.beginPath();ctx.arc(a,b,r,0,TAU);ctx.fill()}ctx.restore()}}
function drawDuck(q){ctx.save();ctx.translate(q.x,q.y+Math.sin(q.age*4+q.phase)*12);ctx.scale(q.dir,1);ctx.drawImage(assets.duck,-q.size,-q.size*.52,q.size*2.1,q.size*1.1);ctx.restore()}
function drawWeapon(){if(!hand?.gun)return;let swayX=clamp((aim.x-W/2)*.045,-22,22),swayY=clamp((aim.y-H*.44)*.025,-12,15),gX=W*.63+swayX,gY=H-142+swayY+recoil*18,angle=clamp((aim.x-W/2)*.00045,-.2,.2)-recoil*.035;ctx.save();ctx.translate(gX,gY);ctx.rotate(angle);ctx.globalAlpha=.98;ctx.drawImage(assets.hand,-190,-35,250,210);ctx.drawImage(assets.weapon,-15,-45,390,225);if(flash>0){ctx.globalAlpha=flash;ctx.drawImage(assets.flash,275,-70,100,100)}ctx.restore();ctx.globalAlpha=1}
function reticle(){if(!hand)return;ctx.strokeStyle=hand.gun?'#ffe066':'#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(aim.x,aim.y,24,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(aim.x-36,aim.y);ctx.lineTo(aim.x-10,aim.y);ctx.moveTo(aim.x+10,aim.y);ctx.lineTo(aim.x+36,aim.y);ctx.moveTo(aim.x,aim.y-36);ctx.lineTo(aim.x,aim.y-10);ctx.moveTo(aim.x,aim.y+10);ctx.lineTo(aim.x,aim.y+36);ctx.stroke()}
function shoot(now){if(!hand?.trigger||now-lastShot<360)return;lastShot=now;recoil=1;flash=1;let hit=null,best=Infinity;for(const q of ducks){let n=dist(q,aim);if(n<best){best=n;hit=q}}if(hit&&best<Math.max(145,hit.size*1.9)){ducks.splice(ducks.indexOf(hit),1);score++}else score=Math.max(0,score-1)}
function angle(a,b,c){const ab=Math.hypot(a.x-b.x,a.y-b.y),cb=Math.hypot(c.x-b.x,c.y-b.y);return Math.acos(clamp((ab*ab+cb*cb-Math.hypot(a.x-c.x,a.y-c.y)**2)/(2*ab*cb),-1,1))*180/Math.PI}
function fingerCurled(lm){const pip=angle(lm[8],lm[6],lm[5]),dip=angle(lm[6],lm[7],lm[8]);return pip<148&&dip<155}
function read(result){if(!result.landmarks?.length){hand=null;return}const lm=result.landmarks[0],thumbOpen=dist(lm[4],lm[0])>dist(lm[2],lm[0])*.86;const indexCurled=fingerCurled(lm);const gun=thumbOpen;fingerState.openFrames=indexCurled?0:fingerState.openFrames+1;fingerState.closedFrames=indexCurled?fingerState.closedFrames+1:0;let trigger=false;if(gun&&fingerState.closedFrames>=2&&!fingerState.closed){trigger=true;fingerState.closed=true}if(!indexCurled&&fingerState.openFrames>=2)fingerState.closed=false;const thumb={x:(1-lm[4].x)*W,y:lm[4].y*H};hand={thumb,gun,trigger};targetAim={x:thumb.x,y:thumb.y}}
async function setup(){status.textContent='El modeli yükleniyor...';const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');model=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});video.srcObject=stream;await video.play();start.classList.add('hidden');status.textContent='Başparmak açık, diğer parmaklar kapalı olabilir. İşaret parmağının eklemlerini büküp açarak ateş et.';requestAnimationFrame(loop)}
function loop(now){const dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;world+=dt*70;recoil=Math.max(0,recoil-dt*7);flash=Math.max(0,flash-dt*10);sky();for(const z of clouds){z.x-=z.speed*dt;if(z.x<-190)Object.assign(z,cloud())}if(!over){spawn-=dt;if(spawn<=0){ducks.push(duck());spawn=rnd(1,1.8)}for(const q of ducks){q.x+=q.dir*q.speed*dt;q.age+=dt;drawDuck(q)}for(let i=ducks.length-1;i>=0;i--)if(ducks[i].x<-170||ducks[i].x>W+170){ducks.splice(i,1);lives--}if(video.readyState>=2&&video.currentTime!==lastVideo){lastVideo=video.currentTime;read(model.detectForVideo(video,now))}aim.x+=(targetAim.x-aim.x)*Math.min(1,dt*9);aim.y+=(targetAim.y-aim.y)*Math.min(1,dt*9);shoot(now);drawWeapon();reticle();if(lives<=0)over=true}ctx.fillStyle='#102238cc';ctx.fillRect(18,18,410,82);ctx.fillStyle='#fff';ctx.font='bold 24px system-ui';ctx.fillText(`Skor: ${score}`,34,50);ctx.fillText(`Can: ${'♥'.repeat(Math.max(0,lives))}`,34,79);if(over){ctx.fillStyle='#102238dd';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 64px system-ui';ctx.fillText('Oyun Bitti',W/2,H/2-20);ctx.font='28px system-ui';ctx.fillText(`Skorun: ${score} — Yenilemek için sayfayı yenile`,W/2,H/2+40);ctx.textAlign='start'}requestAnimationFrame(loop)}
start.addEventListener('click',()=>setup().catch(e=>status.textContent='Hata: '+e.message));window.addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
