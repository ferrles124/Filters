<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Hunt</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden; display: grid; place-items: center;
      background: #081329; font-family: system-ui, sans-serif;
    }
    canvas { width: min(100vw, 1280px); height: min(100vh, 720px); object-fit: contain; display: block; }
    #status { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 2;
      padding: 8px 14px; border-radius: 999px; background: #07101dcc; color: white; font-size: 14px; }
    #start { position: fixed; z-index: 3; border: 0; border-radius: 14px; padding: 14px 24px;
      background: #ffb703; color: #18202b; font-size: 18px; font-weight: 700; cursor: pointer; }
    #start.hidden { display: none; }
  </style>
</head>
<body>
  <div id="status">Başlamak için kameraya izin verip butona bas</div>
  <button id="start">Oyunu Başlat</button>
  <canvas id="game" width="1280" height="720"></canvas>
  <video id="camera" autoplay playsinline muted hidden></video>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("camera");
    const status = document.getElementById("status");
    const startButton = document.getElementById("start");
    const W = canvas.width, H = canvas.height;
    const TAU = Math.PI * 2;
    let landmarker, stream, lastVideoTime = -1, lastFrame = performance.now();
    let hand = null, ducks = [], clouds = [], score = 0, lives = 5, spawn = 0, lastShot = -1;
    let gameStarted = false, gameOver = false, world = 0;

    const random = (a, b) => a + Math.random() * (b - a);
    const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

    function makeCloud(initial = false) {
      return { x: initial ? random(-100, W) : W + random(40, 220), y: random(60, 310),
        size: random(.7, 1.7), speed: random(8, 24) };
    }
    clouds = Array.from({ length: 9 }, () => makeCloud(true));

    function makeDuck() {
      const direction = Math.random() < .5 ? 1 : -1;
      return { x: direction > 0 ? -90 : W + 90, y: random(150, H * .72), direction,
        speed: random(150, 250), size: random(34, 54), phase: random(0, TAU), age: 0 };
    }

    function drawSky() {
      const gradient = ctx.createLinearGradient(0, 0, 0, H);
      gradient.addColorStop(0, "#399ed3"); gradient.addColorStop(.7, "#bcecff"); gradient.addColorStop(1, "#d9f2c0");
      ctx.fillStyle = gradient; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#86bf78"; ctx.fillRect(0, H * .78, W, H * .22);
      ctx.fillStyle = "#a9d789";
      for (let x = -80 - (world * .35 % 80); x < W + 80; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, H * .78); ctx.lineTo(x + 38, H * .70); ctx.lineTo(x + 76, H * .78); ctx.fill();
      }
      for (const cloud of clouds) {
        ctx.save(); ctx.translate(cloud.x, cloud.y); ctx.scale(cloud.size, cloud.size); ctx.fillStyle = "#fff";
        for (const [x, y, r] of [[0, 8, 35], [38, 0, 48], [78, 12, 32], [42, 20, 55]]) {
          ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawDuck(d) {
      ctx.save(); ctx.translate(d.x, d.y + Math.sin(d.age * 4 + d.phase) * 15); ctx.scale(d.direction, 1);
      const s = d.size; ctx.fillStyle = "#f7c843";
      ctx.beginPath(); ctx.ellipse(0, 0, s, s * .48, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffe477"; ctx.beginPath(); ctx.arc(s * .55, -s * .27, s * .37, 0, TAU); ctx.fill();
      ctx.fillStyle = "#e87827"; ctx.beginPath(); ctx.moveTo(s * .82, -s * .28); ctx.lineTo(s * 1.25, -s * .15); ctx.lineTo(s * .82, -.03 * s); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(-s * .08, -s * .1, s * .32, s * .15, -.45, 0, TAU); ctx.fill();
      ctx.fillStyle = "#202938"; ctx.beginPath(); ctx.arc(s * .63, -s * .36, Math.max(3, s * .07), 0, TAU); ctx.fill();
      ctx.restore();
    }

    function drawReticle() {
      if (!hand) return;
      ctx.strokeStyle = hand.pinch ? "#ff5964" : "#fff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(hand.x, hand.y, 22, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hand.x - 31, hand.y); ctx.lineTo(hand.x - 10, hand.y); ctx.moveTo(hand.x + 10, hand.y); ctx.lineTo(hand.x + 31, hand.y);
      ctx.moveTo(hand.x, hand.y - 31); ctx.lineTo(hand.x, hand.y - 10); ctx.moveTo(hand.x, hand.y + 10); ctx.lineTo(hand.x, hand.y + 31); ctx.stroke();
    }

    function shoot(now) {
      if (!hand || !hand.pinch || now - lastShot < 420) return;
      lastShot = now;
      let target = null, distance = Infinity;
      for (const duck of ducks) {
        const d = Math.hypot(duck.x - hand.x, duck.y - hand.y);
        if (d < distance) { distance = d; target = duck; }
      }
      if (target && distance < target.size * 1.7) { ducks.splice(ducks.indexOf(target), 1); score++; }
      else score = Math.max(0, score - 1);
    }

    async function setup() {
      status.textContent = "El modeli yükleniyor...";
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      landmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO", numHands: 1, minHandDetectionConfidence: .55, minHandPresenceConfidence: .55, minTrackingConfidence: .55
      });
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false });
      video.srcObject = stream; await video.play();
      gameStarted = true; startButton.classList.add("hidden"); status.textContent = "İşaret parmağınla nişan al, başparmakla birleştirerek ateş et";
      requestAnimationFrame(loop);
    }

    function loop(now) {
      const dt = Math.min(.05, (now - lastFrame) / 1000); lastFrame = now; world += dt * 80;
      drawSky();
      for (const c of clouds) { c.x -= c.speed * dt; if (c.x < -180) Object.assign(c, makeCloud()); }
      if (!gameOver) {
        spawn -= dt; if (spawn <= 0) { ducks.push(makeDuck()); spawn = random(.65, 1.35); }
        for (const d of ducks) { d.x += d.direction * d.speed * dt; d.age += dt; drawDuck(d); }
        for (let i = ducks.length - 1; i >= 0; i--) {
          if (ducks[i].x < -130 || ducks[i].x > W + 130) { ducks.splice(i, 1); lives--; }
        }
        if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const result = landmarker.detectForVideo(video, now);
          if (result.landmarks?.length) {
            const lm = result.landmarks[0], tip = lm[8], thumb = lm[4];
            hand = { x: (1 - tip.x) * W, y: tip.y * H, pinch: Math.hypot((tip.x - thumb.x) * W, (tip.y - thumb.y) * H) < 48 };
          } else hand = null;
        }
        shoot(now); drawReticle();
        if (lives <= 0) gameOver = true;
      }
      ctx.fillStyle = "#102238cc"; ctx.fillRect(18, 18, 235, 72);
      ctx.fillStyle = "#fff"; ctx.font = "bold 25px system-ui"; ctx.fillText(`Skor: ${score}`, 34, 50); ctx.fillText(`Can: ${"♥".repeat(Math.max(0, lives))}`, 34, 78);
      if (gameOver) { ctx.fillStyle = "#102238dd"; ctx.fillRect(0, 0, W, H); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 64px system-ui"; ctx.fillText("Oyun Bitti", W / 2, H / 2 - 20); ctx.font = "28px system-ui"; ctx.fillText(`Skorun: ${score} — Yenilemek için sayfayı yenile`, W / 2, H / 2 + 40); ctx.textAlign = "start"; }
      requestAnimationFrame(loop);
    }

    startButton.addEventListener("click", () => setup().catch(err => { status.textContent = "Hata: " + err.message; }));
    window.addEventListener("beforeunload", () => stream?.getTracks().forEach(track => track.stop()));
  </script>
</body>
</html>
