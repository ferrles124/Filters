<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filters</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      flex-direction: column;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
    }
    #status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      color: lime;
      background: rgba(0,0,0,0.7);
      font-family: monospace;
      font-size: 12px;
      padding: 4px;
      z-index: 10;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="status">Başlıyor...</div>
  <canvas id="canvas"></canvas>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver,
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const statusEl = document.getElementById("status");
    function log(msg) {
      statusEl.textContent = msg;
      console.log(msg);
    }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const video = document.createElement("video");
    video.playsInline = true;
    video.muted = true;

    let handLandmarker = null;

    async function setupHandLandmarker() {
      log("Model dosyaları indiriliyor...");
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      log("Model yükleniyor...");
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        numHands: 2,
      });
      log("Model hazır, kamera başlatılıyor...");
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: 640, height: 480 },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      log("Çalışıyor.");
      drawLoop();
    }

    const INDEX_TIP = 8;
    const THUMB_TIP = 4;

    // ---- Portal geometrisi (geometry.py'nin JS karşılığı) ----

    function portalWidth(p1, p2, p3, p4) {
      const topW = Math.hypot(p3.x - p1.x, p3.y - p1.y);
      const bottomW = Math.hypot(p4.x - p2.x, p4.y - p2.y);
      return (topW + bottomW) / 2.0;
    }

    class ClosingGestureDetector {
      constructor(closeRatio = 0.16, openRatio = 0.30) {
        this.closeRatio = closeRatio;
        this.openRatio = openRatio;
        this.isClosed = false;
      }
      update(width, frameW) {
        const closeThreshold = this.closeRatio * frameW;
        const openThreshold = this.openRatio * frameW;
        let triggered = false;
        if (!this.isClosed && width < closeThreshold) {
          this.isClosed = true;
          triggered = true;
        } else if (this.isClosed && width > openThreshold) {
          this.isClosed = false;
        }
        return triggered;
      }
    }

    // ---- Filtreler (şimdilik sadece placeholder grid) ----

    function filtroGrid(imageData) {
      const { data, width, height } = imageData;
      const step = 20;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (x % step === 0 || y % step === 0) {
            const i = (y * width + x) * 4;
            data[i] = 255;
            data[i + 1] = 255;
            data[i + 2] = 255;
          }
        }
      }
      return imageData;
    }

    const FILTROS = [filtroGrid];
    let filtroIndex = 0;

    function renderPortal(p1, p2, p3, p4, filtroFunc) {
      const polygon = [p1, p3, p4, p2];

      const xs = polygon.map((p) => p.x);
      const ys = polygon.map((p) => p.y);
      let x = Math.max(0, Math.floor(Math.min(...xs)));
      let y = Math.max(0, Math.floor(Math.min(...ys)));
      let bw = Math.ceil(Math.max(...xs)) - x;
      let bh = Math.ceil(Math.max(...ys)) - y;
      bw = Math.min(bw, canvas.width - x);
      bh = Math.min(bh, canvas.height - y);
      if (bw <= 1 || bh <= 1) return;

      // Poligonla kırp (mask.fillPoly + blend'in canvas karşılığı)
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(polygon[0].x, polygon[0].y);
      for (let i = 1; i < polygon.length; i++) {
        ctx.lineTo(polygon[i].x, polygon[i].y);
      }
      ctx.closePath();
      ctx.clip();

      const imageData = ctx.getImageData(x, y, bw, bh);
      const filtered = filtroFunc(imageData);
      ctx.putImageData(filtered, x, y);

      ctx.restore();

      // Portal çerçevesi
      ctx.beginPath();
      ctx.moveTo(polygon[0].x, polygon[0].y);
      for (let i = 1; i < polygon.length; i++) {
        ctx.lineTo(polygon[i].x, polygon[i].y);
      }
      ctx.closePath();
      ctx.strokeStyle = "white";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    const closingDetector = new ClosingGestureDetector();

    function drawLoop() {
      const nowMs = performance.now();
      let results = null;

      if (handLandmarker) {
        results = handLandmarker.detectForVideo(video, nowMs);
      }

      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      ctx.restore();

      if (results && results.landmarks && results.landmarks.length === 2) {
        // Ekranda hangi el solda hangi el sağda: mirrored x'e göre sırala
        const hands = results.landmarks
          .map((lm) => ({
            lm,
            mirroredX: 1 - lm[INDEX_TIP].x,
          }))
          .sort((a, b) => a.mirroredX - b.mirroredX);

        const lmLeft = hands[0].lm;
        const lmRight = hands[1].lm;

        const toPoint = (landmark) => ({
          x: (1 - landmark.x) * canvas.width,
          y: landmark.y * canvas.height,
        });

        const p1 = toPoint(lmLeft[INDEX_TIP]);
        const p2 = toPoint(lmLeft[THUMB_TIP]);
        const p3 = toPoint(lmRight[INDEX_TIP]);
        const p4 = toPoint(lmRight[THUMB_TIP]);

        const width = portalWidth(p1, p2, p3, p4);

        if (closingDetector.update(width, canvas.width)) {
          filtroIndex = (filtroIndex + 1) % FILTROS.length;
        }

        renderPortal(p1, p2, p3, p4, FILTROS[filtroIndex]);
      }

      requestAnimationFrame(drawLoop);
    }

    async function main() {
      try {
        await setupHandLandmarker();
        await startCamera();
      } catch (err) {
        log("HATA: " + err.message);
      }
    }

    main();
  </script>
</body>
</html>
